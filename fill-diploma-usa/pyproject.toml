[project]
name = "fill-diploma-usa"
version = "0.0.1"
description = "Program to fill the USA diplomas from an Excel file."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "gooey>=1.0.8.1",
    "openpyxl>=3.1.5",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.10.2",
    "six>=1.17.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
